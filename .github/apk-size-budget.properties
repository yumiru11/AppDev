# ============================================================
# APK 体积回归预算（nightly.yml -> release-shrink job 消费）
#
# 判定：release 变体（R8 + 资源缩减）APK 字节数 > budget_bytes 时，
#       .github/scripts/check-apk-size.sh 判红（::error:: + exit 1），
#       nightly 失败通道随即开/更新 nightly-failure issue。
#
# baseline_bytes —— pin 住的当前体积（只随「有意重定基线」改动）：
#   实测来源：2026-09-13 本机 canonical release 构建 @ 2a44912（离线 KaTeX #269 已合入）
#             = 7,585,167 B（7.23 MiB）。
#   交叉验证：nightly run 34716806285（@54eba10，KaTeX 合入前）release APK =
#             7,237,309 B；差值 +347,858 B ≈ KaTeX 研究预测的 +0.33 MiB，
#             证明本机与 CI 的 release 构建体积可对齐（差在 KB 级）。
#
# budget_bytes —— 门禁阈值 = 基线 + 256 KiB（262,144 B）余量：
#   余量用于吸收依赖升级/构建噪声的 KB 级抖动；任何「有实感的」静默膨胀
#   （KaTeX 级 +0.33 MiB、Mermaid Tiny 级 +0.64 MiB，或大块代码/资源）
#   都会触发本门禁，必须走下面的「有意提高」流程。
#
# 如何有意提高预算（只允许随「有意的体积增长」同行）：
#   1. 在 PR 描述里写清新增内容（如 Mermaid Tiny assets）与实测增量；
#   2. 同步上调 budget_bytes（必要时连 baseline_bytes 一起重定），
#      并在 PR 中记录「旧值 → 新值 + 理由」；
#   3. 禁止为过门禁临时抬高 —— 与截图基线同样纪律：预算变更必须在 PR 里被看到。
# ============================================================
baseline_bytes=7585167
budget_bytes=7847311
