// ============================================================
// CI 用 Gradle 镜像配置（由 ci.yml / release.yml 复制到
// $GRADLE_USER_HOME/init.d/mirror.gradle 后生效）。
//
// 背景：开发机有全局 ~/.gradle/init.d/mirror.gradle 覆盖仓库列表
// （本机全链验证即在该配置下通过）；GitHub runner 上没有该脚本，
// 仅靠 settings.gradle.kts 的仓库列表无法解析 ksp 插件 marker
// （实测 CI 报 "could not resolve plugin artifact
// com.google.devtools.ksp:...:2.3.11"，全部候选仓库均未命中）。
// 本文件与开发机配置保持一致，保证 CI 与本机解析行为对齐。
//
// 优先级：阿里云 > 腾讯云 > 华为云 > 网易163 > 官方兜底
// ============================================================

gradle.settingsEvaluated { settings ->
    // ---------- 插件仓库 (pluginManagement) ----------
    settings.pluginManagement {
        repositories {
            clear()
            maven { url 'https://maven.aliyun.com/repository/public' }
            maven { url 'https://maven.aliyun.com/repository/google' }
            maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
            maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
            maven { url 'https://repo.huaweicloud.com/repository/maven/' }
            // 官方源兜底
            google()
            mavenCentral()
            gradlePluginPortal()
        }
    }

    // ---------- 依赖仓库 (dependencyResolutionManagement) ----------
    settings.dependencyResolutionManagement {
        repositories {
            clear()
            maven { url 'https://maven.aliyun.com/repository/public' }
            maven { url 'https://maven.aliyun.com/repository/google' }
            maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
            maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
            maven { url 'https://repo.huaweicloud.com/repository/maven/' }
            maven { url 'https://mirrors.163.com/maven/repository/maven-public/' }
            // 注意：Gradle 规则是 POM 在哪个仓库解析到，JAR 就只从那个仓库下载，
            // 镜像同步不全时末尾的兜底源不会生效。exclusiveContent 强制这些组直连官方源。
            exclusiveContent {
                forRepository { mavenCentral() }
                filter { includeGroup 'com.apollographql' }
                filter { includeGroup 'io.github.takahirom.roborazzi' }
                filter { includeGroup 'org.robolectric' }
            }
            // 官方源兜底
            google()
            mavenCentral()
        }
    }
}
