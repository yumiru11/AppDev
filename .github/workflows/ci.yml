# T1 质量门禁：PR / main push 必跑的检查流水线。
#
# 作为 required check 使用时（交付阶段配置 branch protection）：
#   - 纯文档 PR（仅 docs/**/*.md、*.md、LICENSE 等）会被 paths-ignore 过滤掉，
#     工作流不触发、required check 自动跳过，不会卡住 docs-only 合并。
#   - 取舍：若未来出现「代码 + docs」混合变更，仍会触发全部检查（路径过滤是
#     排除语义，不是包含语义），无需额外处理。
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**/*.md'
      - '**/*.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore:
      - 'docs/**/*.md'
      - '**/*.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # 覆盖率 PR 评论（gh pr comment 需要 pull-requests 写权限）
  pull-requests: write

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # gradle.properties 中的 org.gradle.java.home 是开发机私有路径（本机红线配置，不入库改），
      # GitHub runner 上不存在会导致首个 Gradle 步骤硬失败；删除后回退到 setup-java 的 JAVA_HOME
      - name: Override local JDK path for CI
        # GNU sed（ubuntu）与 BSD sed（macos）的 -i 语法不兼容——python 跨平台
        run: python3 -c "import re; p='gradle.properties'; s=open(p).read(); open(p,'w').write(re.sub(r'(?m)^org\.gradle\.java\.home.*\n?', '', s))"

      # 开发机有全局 ~/.gradle/init.d/mirror.gradle（阿里云优先，本机 Google Maven 不可达）；
      # GitHub runner 直连官方源即可（阿里云在 CI 上 502，2026-08-12 实测），不再注入镜像
      # 注：seed-plugins.sh 仍保留（runner 插件 marker 解析的 curl 兜底，走官方源）
      # runner 上 Gradle 插件 marker 远程解析异常（curl 直取同 URL 却 200），
      # 用 curl 预置全部插件构件到 mavenLocal 作确定性兜底（详见脚本头注）
      - name: Seed plugin artifacts into mavenLocal
        run: bash .github/gradle/seed-plugins.sh

      # gradle/actions/setup-gradle@v4：自带构建缓存 + 依赖缓存
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Spotless check (ktlint)
        run: ./gradlew spotlessCheck --no-daemon

      - name: Detekt
        run: ./gradlew detekt --no-daemon

      - name: Android Lint
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Konsist architecture tests
        run: ./gradlew konsistCheck --no-daemon

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      # 失败时保留截图 diff 供排查（实际截图/compare 产物）；空测试阶段直接通过
      - name: Verify Roborazzi screenshots
        run: ./gradlew :app:verifyRoborazziDebug --no-daemon

      - name: Upload Roborazzi diffs (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: roborazzi-diffs
          path: |
            **/build/outputs/roborazzi/**
            **/build/roborazzi/**
          if-no-files-found: ignore

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # ── 覆盖率门禁（Phase B，testing-strategy.md §6/§7）─────────────────────
      # coverageReport / coverageVerify 是根级聚合任务（构建侧契约，见根 build 任务实现）；
      # 必须在此步执行——它们聚合各模块 testDebugUnitTest 的 JaCoCo 数据（单测步骤在上面）。
      # coverageVerify 是硬门禁：任一模块低于阈值 → job 红（per-module thresholds）。
      - name: Coverage report + verify (hard gate)
        run: ./gradlew coverageReport coverageVerify --no-daemon

      # diffCoverageCheck 是软门禁（PR 变更的新增代码 ≥80%，-PdiffCoverageThreshold 可调）。
      # 任务可能尚未落地（与构建侧任务并行开发），先 --dry-run 探测：不存在 → 显式跳过并告警，
      # 不把 job 染红；continue-on-error 兜底（软门禁，暂不硬卡合并）。
      - name: Diff coverage check (soft gate, best-effort)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          if ./gradlew diffCoverageCheck --dry-run -q >/dev/null 2>&1; then
            ./gradlew diffCoverageCheck -PdiffCoverageThreshold=80 -PdiffBaseSha=${{ github.event.pull_request.base.sha }} --no-daemon
          else
            echo "::warning::diffCoverageCheck task not present; diff coverage gate skipped"
          fi

      # 聚合报告上传：if: always() —— coverageVerify 失败时也保留报告供排查。
      # glob 覆盖根级聚合报告（build/reports/jacoco/coverageReport/html）与各模块报告。
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            **/build/reports/jacoco/*/html/**
            **/build/reports/coverage/**/html/**
          if-no-files-found: ignore

      # PR 覆盖率摘要评论：GitHub artifact URL 不能内联为图片（screenshot-automation.md 调研
      # 结论），文本摘要 + artifact 链接是稳妥方案。解析聚合/各模块 jacoco XML 的 LINE counter
      # 汇总成每模块表格；XML 缺失时降级为纯链接评论。仅 pull_request 事件且全绿时运行；
      # 评论失败不染红 job（continue-on-error）。
      - name: Post coverage summary comment
        if: github.event_name == 'pull_request' && success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PYEOF' > /tmp/coverage-comment.md
          import glob
          import os
          import xml.etree.ElementTree as ET

          repo = os.environ.get("GITHUB_REPOSITORY", "")
          run_id = os.environ.get("GITHUB_RUN_ID", "")

          def line_pct(path):
              try:
                  root = ET.parse(path).getroot()
                  counters = {c.get("type"): c for c in root.findall("counter")}
                  c = counters.get("LINE")
                  if c is None:
                      return None
                  missed = int(c.get("missed", "0"))
                  covered = int(c.get("covered", "0"))
                  total = missed + covered
                  return (covered * 100.0 / total) if total else None
              except Exception:
                  return None

          def module_label(rel):
              parts = rel.split("/")
              if parts and parts[0] in ("core", "feature") and len(parts) > 1:
                  return "/".join(parts[:2])
              return parts[0] if parts else "?"

          # 聚合 XML（根级 coverageReport 任务产物）→ 总覆盖率
          agg = sorted(glob.glob("build/reports/jacoco/coverageReport/*.xml"))
          overall = line_pct(agg[0]) if agg else None

          # 各模块 XML → 每模块 LINE 覆盖率（同模块多份报告取最大）
          paths = sorted(glob.glob("**/build/reports/jacoco/*/*.xml", recursive=True))
          paths += sorted(glob.glob("**/build/reports/coverage/**/xml/*.xml", recursive=True))
          by_mod = {}
          for p in paths:
              p = p.replace(os.sep, "/")
              # 聚合 XML 已由 overall 表示，不再重复计入模块表
              if p.startswith("build/reports/jacoco/coverageReport/"):
                  continue
              pct = line_pct(p)
              if pct is not None:
                  mod = module_label(p)
                  by_mod[mod] = max(by_mod.get(mod, 0.0), pct)

          lines = []
          if overall is not None:
              lines.append(f"**Overall line coverage: {overall:.1f}%**")
          else:
              lines.append("Coverage report generated (overall percentage not parseable).")
          if by_mod:
              lines.append("")
              lines.append("<details><summary>Per-module line coverage</summary>")
              lines.append("")
              lines.append("| Module | Line coverage |")
              lines.append("|---|---|")
              for mod, pct in sorted(by_mod.items()):
                  lines.append(f"| {mod} | {pct:.1f}% |")
              lines.append("</details>")
          lines.append("")
          lines.append(f"[Download full coverage report](https://github.com/{repo}/actions/runs/{run_id}/artifacts)")
          print("\n".join(lines))
          PYEOF
          gh pr comment "$PR_NUMBER" --body-file /tmp/coverage-comment.md

  # ── 截图回归（screenshot-automation.md 调研：自建 KVM 模拟器 + Maestro，$0）──────
  # 依赖 quality 门禁（全绿才开模拟器）；KVM 由 android-emulator-runner 在 ubuntu-latest
  # 上配置（runner 暴露 /dev/kvm）。Maestro 流契约：.maestro/screenshots/*.yaml
  # （并行 agent 所有，本 job 只消费，详见契约注释在 Maestro 步骤）。
  # PR 评论用 sticky comment（GitHub artifact URL 不能内联渲染 → 文本链接到 artifact）。
  screenshots:
    name: Screenshots (emulator + Maestro)
    needs: quality
    # release asset 上传需 contents: write（顶层只有 read——第 12 轮 release 创建
    # 静默失败致评论图 404）
    permissions:
      contents: write
      pull-requests: write
    # ubuntu-latest 有 /dev/kvm（GitHub 2024-04-02 官方公告 + 2026 实证），
    # 但需先启用 kvm 组权限（udev）——否则 action 报 'hardware acceleration
    # is not available'（PR #60 第 1 轮根因）。macos-14 ARM 托管 runner 是 VM，
    # 无嵌套虚拟化，arm64 模拟器无法 boot（第 3-6 轮根因，issue #375/#280）。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # GitHub 官方 README：'Remember to enable KVM in your workflow'
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Override local JDK path for CI
        # GNU sed（ubuntu）与 BSD sed（macos）的 -i 语法不兼容——python 跨平台
        run: python3 -c "import re; p='gradle.properties'; s=open(p).read(); open(p,'w').write(re.sub(r'(?m)^org\.gradle\.java\.home.*\n?', '', s))"

      # quality job 已跑完整构建（含 seed-plugins 兜底）；screenshots 只重打 APK。
      # macos-14 上 seed-plugins.sh curl 失败（exit 56 网络接收错误）——macos 网络
      # 通道不同，插件解析未验证是否需要 seed；若 assemble 因此失败再加回。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      # 模拟器 boot 由 action 处理（KVM udev + 等待 sys.boot_completed）；adb 暴露在
      # localhost:5554，Maestro 自动发现设备。Maestro CLI 在此脚本内安装（~/.maestro/bin）。
      # 流契约（并行 agent 遵守）：.maestro/screenshots/*.yaml，launchApp appId 为
      # com.yumiru11.githubapp；maestro test 会把截图自动拉到 ~/.maestro/tests/<flow-name>/。
      - name: Run Maestro screenshot flows on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 31：CI 上最稳的模拟器镜像（API 34 google_apis 在 GitHub runner
          # 上 boot 卡死——PR #60 实测 8.5 分钟未完成，用户取消）。minSdk 26，
          # README/导航/主题截图场景 API 31 完全够用。
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_6
          cores: 2
          # KVM 硬件加速下无需软件渲染参数；-no-snapshot 防快照缓存干扰
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            # 轻量 adb 截图方案（Maestro 3 次安装翻车——见 docs/research/actions-emulator-feasibility.md Q5）；
            # 脚本输出到 artifacts/screenshots/，供后续 Collect/Upload/评论步骤
            bash .github/scripts/screenshots.sh

      # 截图已由 screenshots.sh 直接输出到 artifacts/screenshots/；失败也保留供排查
      - name: Verify screenshots collected
        if: always()
        run: |
          mkdir -p artifacts/screenshots
          echo "files: $(find artifacts/screenshots -name '*.png' | wc -l)" 

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: artifacts/screenshots/**
          if-no-files-found: warn

      # 评论永不染红 job（continue-on-error）；仅 PR 事件、job 未取消时发布
      # marocchino 无 images 输入（action.yml 实证）——公开仓库 release asset
      # URL 可直接内联进评论（docs/research/actions-emulator-feasibility.md Q5）
      - name: Upload screenshots + post PR comment (images inlined)
        if: github.event_name == 'pull_request' && !cancelled()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="screenshots-${{ github.run_id }}"
          gh release create "$TAG" artifacts/screenshots/*.png --title "CI screenshots $TAG" --notes "Auto-generated by screenshots job" >/dev/null 2>&1 || true
          {
            echo "## Screenshot regression (emulator)"
            echo ""
            for f in artifacts/screenshots/*.png; do
              name=$(basename "$f")
              echo "### ${name%.png}"
              echo "![$name](https://github.com/${{ github.repository }}/releases/download/$TAG/$name)"
              echo ""
            done
            # 渲染通道判定（native/webview 以 ReadmeRender 日志为准——禁止视觉推断）
            if [ -f artifacts/screenshots/readme-render-log.txt ]; then
              echo "## ReadmeRender decisions"
              echo '```'
              cat artifacts/screenshots/readme-render-log.txt
              echo '```'
              echo ""
            fi
          } > /tmp/screenshots-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/screenshots-comment.md || true
          # 清理历史截图 release（保留最新，避免 release 列表堆积）
          gh release list --limit 20 --json tagName -q '.[].tagName' | grep '^screenshots-' | grep -v "$TAG" | while read -r old; do
            gh release delete "$old" --yes --cleanup-tag >/dev/null 2>&1 || true
          done
