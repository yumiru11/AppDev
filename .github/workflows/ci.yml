# T1 质量门禁：PR / main push 必跑的检查流水线。
#
# 作为 required check 使用时（交付阶段配置 branch protection）：
#   - 纯文档 PR（仅 docs/**/*.md、*.md、LICENSE 等）会被 paths-ignore 过滤掉，
#     工作流不触发、required check 自动跳过，不会卡住 docs-only 合并。
#   - 取舍：若未来出现「代码 + docs」混合变更，仍会触发全部检查（路径过滤是
#     排除语义，不是包含语义），无需额外处理。
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**/*.md'
      - '**/*.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore:
      - 'docs/**/*.md'
      - '**/*.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # 覆盖率 PR 评论（gh pr comment 需要 pull-requests 写权限）
  pull-requests: write

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # ★ fetch-depth: 0（#170 / D04 实测踩到）：diffCoverageCheck 用
      # `git diff --unified=0 <base>...HEAD` 逐行比对新增代码，而 actions/checkout 默认
      # 浅克隆（depth=1）拿不到 PR base 提交 → git 退出 128（"bad object"）。
      # 本地全量仓库跑得通、CI 一开硬门禁就红，根因就在这里。
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # gradle.properties 中的 org.gradle.java.home 是开发机私有路径（本机红线配置，不入库改），
      # GitHub runner 上不存在会导致首个 Gradle 步骤硬失败；删除后回退到 setup-java 的 JAVA_HOME
      - name: Override local JDK path for CI
        # GNU sed（ubuntu）与 BSD sed（macos）的 -i 语法不兼容——python 跨平台
        run: python3 -c "import re; p='gradle.properties'; s=open(p).read(); open(p,'w').write(re.sub(r'(?m)^org\.gradle\.java\.home.*\n?', '', s))"

      # ── 裸控件门禁（设计系统 Batch 3，implementation-plan.md §5）──────────────
      # 六类裸 M3 控件（词边界 Card/Scaffold/FilterChip/AlertDialog/ModalBottomSheet/
      # SnackbarHost）的计数不得超过 .github/bare-controls-baseline.txt 的基准——只许
      # 持平或下降。纯静态 bash，秒级失败（放在 Gradle 步骤之前）。
      # 红→绿实证（临时注入裸 Card( → exit 1，撤销 → exit 0）与基准口径见 Batch 3 PR body。
      - name: Forbid new bare controls (design system)
        run: bash .github/scripts/forbid-bare-controls.sh

      # 开发机有全局 ~/.gradle/init.d/mirror.gradle（阿里云优先，本机 Google Maven 不可达）；
      # GitHub runner 直连官方源即可（阿里云在 CI 上 502，2026-08-12 实测），不再注入镜像
      # 注：seed-plugins.sh 仍保留（runner 插件 marker 解析的 curl 兜底，走官方源）
      # runner 上 Gradle 插件 marker 远程解析异常（curl 直取同 URL 却 200），
      # 用 curl 预置全部插件构件到 mavenLocal 作确定性兜底（详见脚本头注）
      - name: Seed plugin artifacts into mavenLocal
        run: bash .github/gradle/seed-plugins.sh

      # gradle/actions/setup-gradle@v4：自带构建缓存 + 依赖缓存
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Spotless check (ktlint)
        run: ./gradlew spotlessCheck --no-daemon

      - name: Detekt
        run: ./gradlew detekt --no-daemon

      # 全模块 lint（2026-09-12 扩展）：`:app:lintDebug` 不分析依赖模块（checkDependencies
      # 默认 false），feature/core 的源码与资源曾完全不在门禁里（需求审计 §10 P1）。
      # `lintDebug` 从根项目按任务名匹配全部子工程 → 每个 Android 模块跑自己的 lintDebug。
      # `--continue`：第一个模块失败不跳过其余模块 —— 一次看到全部违规，报告也才会全量写出
      # （下一条 registry 守卫要汇总所有报告）。
      # 已知非致命噪音：LintJarApiMigration 会打印 NegativeArraySizeException 后继续跑完
      # （#170 根因，AGP 9.x 才能消除；lint 任务本身仍成功）。
      - name: Android Lint (all modules)
        run: ./gradlew lintDebug --continue --no-daemon

      # ── Lint 覆盖面守卫（#170，AGP 9.1.1 收口）────────────────────────────────
      # 历史：AGP 8.7.3 时代 compose-ui 的 lint jar 链接了比 lint 自带更新的 Kotlin
      # Analysis API，整个 UiIssueRegistry 被跳过（15 项检查不参与分析），当时守卫只能
      # 「只允许 UiIssueRegistry 一个 registry 被跳过」。
      # 现状：AGP 9.1.1 内置 lint 32.1.1 → 检测器全部恢复加载，15 条 disable 已全部删除。
      # 守卫随之升级为三条硬断言：
      #   ① 被跳过的 lint registry 数 = 0（任何跳过都是覆盖面静默退化）；
      #   ② 全模块报告 UnknownIssueId = 0（没有 disable 就不该出现未知 id）；
      #   ③ lint 配置里的 `disable +=` 计数 = 0（禁止用 re-disable 绕过新暴露的违规）。
      - name: Lint detector coverage guard
        run: |
          mapfile -t REPORTS < <(find . -path '*/build/reports/lint-results-debug.txt' -not -path './buildSrc/*' | sort)
          if [ "${#REPORTS[@]}" -eq 0 ]; then
            echo "::error::找不到任何 lint 报告（*/build/reports/lint-results-debug.txt）—— lint 未生成报告"
            exit 1
          fi
          echo "lint 报告数: ${#REPORTS[@]}"
          printf '  %s\n' "${REPORTS[@]}"

          SKIPPED=$(grep -h -o 'Lint found an issue registry ([^)]*)' "${REPORTS[@]}" | sed 's/.*(//;s/)//' | sort -u || true)
          echo "被跳过的 lint registry:"
          echo "${SKIPPED:-（无）}"
          if [ -n "$SKIPPED" ]; then
            echo "::error::出现被跳过的 lint registry（lint 覆盖面静默退化）：$SKIPPED"
            exit 1
          fi
          echo "被跳过的 lint registry 数 = 0"

          UNKNOWN_IDS=$(grep -h 'Unknown issue id' "${REPORTS[@]}" | sort -u || true)
          if [ -n "$UNKNOWN_IDS" ]; then
            echo "::error::lint 报告出现 UnknownIssueId（disable 列表残留或写错 id）："
            printf '%s\n' "$UNKNOWN_IDS"
            exit 1
          fi
          echo "UnknownIssueId = 0"

          DISABLES=$(grep -h -o 'disable += "[^"]*"' \
            app/build.gradle.kts \
            buildSrc/src/main/kotlin/appdev.android.application.gradle.kts \
            buildSrc/src/main/kotlin/appdev.android.library.gradle.kts || true)
          if [ -n "$DISABLES" ]; then
            echo "::error::lint 配置重新出现 disable（#170 已关闭，禁止 re-disable）："
            printf '%s\n' "$DISABLES"
            exit 1
          fi
          echo "lint disable 数 = 0（app + 两个约定插件）"

      # ── i18n lint 规则的运行期证明（防退化第二道防线）──────────────────────────
      # 第一道防线是 buildSrc/src/main/kotlin/AppDevI18nLint.kt 的配置期自检（enable 行
      # 被删 → 任何 Gradle 调用直接失败）；本步证明**检测器真的在跑**：往 feature:editor
      # 的 debug 源集注入 4 条必然违规的 canary（MissingTranslation / HardcodedText /
      # SetTextI18n / StringFormatInvalid）→ 跑单模块 lint → 断言报告里 4 个 issue id 都在
      # → 清理（trap EXIT）。规则被静默 disable / 检测器被跳过 → 本步变红。
      # “规则没在跑”在 lint 报告里是静默的，只有 canary 能证明。
      - name: i18n lint canary (detectors actually run)
        run: bash .github/scripts/lint-i18n-canary.sh

      - name: Konsist architecture tests
        run: ./gradlew konsistCheck --no-daemon

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      # 失败时保留截图 diff 供排查（实际截图/compare 产物）；空测试阶段直接通过
      #
      # ★ D02 修复（#170）：此前只验 :app，模块级基线（core:ui / core:designsystem /
      # core:markdown / feature:*）不在任何门禁里 —— #83 改了 GlassSurface 实现后
      # core:ui 的 AppTopBar_* 基线静默腐烂了整整两周无人发现（本地实测：
      # 6/8 张核心基线 verify 失败）。现在把带 src/test/screenshots 的模块一次全验。
      # ⚠️ 两条硬约束（2026-09-10 实测，别再踩）：
      #
      # ① **模块级基线必须以 CI 为唯一权威录制环境**。Robolectric Native Graphics 的渲染
      #    结果依赖运行环境（字体/原生库/JDK），同一份代码在本机与 runner 上出的 PNG
      #    不是逐字节相同 —— 本机录的 core:ui 基线在 CI 上 verify 全红（8 张）。
      #    :app 的基线之所以一直绿，是因为它当初就是"云端补录"的。
      #    录制入口：Actions → "Record screenshots (CI canonical)" → 下载 artifact 后提交。
      #    本地若 verify 模块级基线失败，先怀疑环境差异，**不要**直接 record 覆盖。
      #
      # ② :feature:issue 已纳入（2026-09-12 修复，原排除注释保留在下方供对照）：
      #    旧注释归因「首帧落不到 loaded 态」不准确 —— 帧里其实已有列表数据，真正挂死的是
      #    Roborazzi 的 compose 捕获路径：截图前它调用 ShadowLooper.shadowMainLooper().idle()
      #    （Roborazzi.kt captureScreenIfMultipleWindows），而屏幕里的无限动画
      #    （PullToRefreshBox 刷新指示器 / CircularProgressIndicator）每帧通过 Choreographer
      #    续订下一帧 → looper 队列永不为空 → idle() 永不返回。本机 jstack 实证：主线程
      #    RUNNABLE、CPU 47.9s 全烧在 ShadowPausedLooper.idle ← captureScreenIfMultipleWindows；
      #    最小复现：单独一个 AppCenteredLoadingState() 在 verify/record 下即挂死（150s timeout）。
      #    修复：IssueListScreen light/dark/rtl 与详情 RTL 全屏帧改用 core:testing 的
      #    captureScreenshotDeterministic（冻结组合时钟 autoAdvance=false + advanceTimeBy(2000)
      #    + 手工 draw decorView + Bitmap.captureRoboImage —— Bitmap 重载不做 idle 等待），
      #    同代码两次独立运行 PNG md5 相同（探针双跑实测 b506b0b4…）；该模块录/验均不再挂。
      #    （历史参照）旧注释：:feature:issue 的截图首帧为 CircularProgressIndicator，
      #    Robolectric waitForIdle 永不收敛 → verify 挂死；漂移曾由 nightly drift job 兜底。
      # ✅ 模块级基线已就位（CI 权威录制，见 "Record screenshots (CI canonical)" workflow），
      # 本步骤覆盖 app + 13 个模块（含 :feature:issue / :feature:pullrequest / 本轮补齐的
      # :feature:home / :feature:search / :feature:editor / :feature:profile / :feature:settings）
      # —— D02「模块级截图基线不在任何门禁」到此闭环。
      #
      # ⚠️ 重新录制基线只能走那个 workflow，**不要**在本机 record 后提交：Robolectric Native
      # Graphics 的渲染依赖运行环境（字体/原生库/JDK），本机与 runner 出的 PNG 不是逐字节
      # 相同，本机录的基线在 CI 上 verify 会全红（PR #181 实测 8 张全红）。
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # ── 覆盖率门禁（Phase B，testing-strategy.md §6/§7）─────────────────────
      # coverageReport / coverageVerify 是根级聚合任务（构建侧契约，见根 build 任务实现）；
      # 必须在此步执行——它们聚合各模块 testDebugUnitTest 的 JaCoCo 数据（单测步骤在上面）。
      # coverageVerify 是硬门禁：任一模块低于阈值 → job 红（per-module thresholds）。
      - name: Coverage report + verify (hard gate)
        run: ./gradlew coverageReport coverageVerify --no-daemon

      # ★ D04 修复（#170）：diffCoverageCheck 从「软门禁 + --dry-run 探测」升级为硬门禁。
      # 原状态：任务已实现（根 build.gradle.kts DiffCoverageCheck），但 CI 用 dry-run 探测 +
      # continue-on-error 兜底，等于从未真正拦过任何 PR —— 探测分支永远为假（任务存在），
      # 而 continue-on-error 让真实失败静默通过。现在直接跑，失败即 job 红。
      # 阈值：新增代码行 ≥80%（-PdiffCoverageThreshold 可调）；UI 源文件按路径白名单跳过
      # （Composable 由 Roborazzi/真机兜底，见任务实现内的 uiSourceExcludes 注释）。
      - name: Diff coverage check (hard gate)
        if: github.event_name == 'pull_request'
        run: |
          ./gradlew diffCoverageCheck \
            -PdiffCoverageThreshold=80 \
            -PdiffBaseSha=${{ github.event.pull_request.base.sha }} \
            --no-daemon

      # 聚合报告上传：if: always() —— coverageVerify 失败时也保留报告供排查。
      # glob 覆盖根级聚合报告（build/reports/jacoco/coverageReport/html）与各模块报告。
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            **/build/reports/jacoco/*/html/**
            **/build/reports/coverage/**/html/**
          if-no-files-found: ignore

      # PR 覆盖率摘要评论：GitHub artifact URL 不能内联为图片（screenshot-automation.md 调研
      # 结论），文本摘要 + artifact 链接是稳妥方案。解析聚合/各模块 jacoco XML 的 LINE counter
      # 汇总成每模块表格；XML 缺失时降级为纯链接评论。仅 pull_request 事件且全绿时运行；
      # 评论失败不染红 job（continue-on-error）。
      - name: Post coverage summary comment
        if: github.event_name == 'pull_request' && success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PYEOF' > /tmp/coverage-comment.md
          import glob
          import os
          import xml.etree.ElementTree as ET

          repo = os.environ.get("GITHUB_REPOSITORY", "")
          run_id = os.environ.get("GITHUB_RUN_ID", "")

          def line_pct(path):
              try:
                  root = ET.parse(path).getroot()
                  counters = {c.get("type"): c for c in root.findall("counter")}
                  c = counters.get("LINE")
                  if c is None:
                      return None
                  missed = int(c.get("missed", "0"))
                  covered = int(c.get("covered", "0"))
                  total = missed + covered
                  return (covered * 100.0 / total) if total else None
              except Exception:
                  return None

          def module_label(rel):
              parts = rel.split("/")
              if parts and parts[0] in ("core", "feature") and len(parts) > 1:
                  return "/".join(parts[:2])
              return parts[0] if parts else "?"

          # 聚合 XML（根级 coverageReport 任务产物）→ 总覆盖率
          agg = sorted(glob.glob("build/reports/jacoco/coverageReport/*.xml"))
          overall = line_pct(agg[0]) if agg else None

          # 各模块 XML → 每模块 LINE 覆盖率（同模块多份报告取最大）
          paths = sorted(glob.glob("**/build/reports/jacoco/*/*.xml", recursive=True))
          paths += sorted(glob.glob("**/build/reports/coverage/**/xml/*.xml", recursive=True))
          by_mod = {}
          for p in paths:
              p = p.replace(os.sep, "/")
              # 聚合 XML 已由 overall 表示，不再重复计入模块表
              if p.startswith("build/reports/jacoco/coverageReport/"):
                  continue
              pct = line_pct(p)
              if pct is not None:
                  mod = module_label(p)
                  by_mod[mod] = max(by_mod.get(mod, 0.0), pct)

          lines = []
          if overall is not None:
              lines.append(f"**Overall line coverage: {overall:.1f}%**")
          else:
              lines.append("Coverage report generated (overall percentage not parseable).")
          if by_mod:
              lines.append("")
              lines.append("<details><summary>Per-module line coverage</summary>")
              lines.append("")
              lines.append("| Module | Line coverage |")
              lines.append("|---|---|")
              for mod, pct in sorted(by_mod.items()):
                  lines.append(f"| {mod} | {pct:.1f}% |")
              lines.append("</details>")
          lines.append("")
          lines.append(f"[Download full coverage report](https://github.com/{repo}/actions/runs/{run_id}/artifacts)")
          print("\n".join(lines))
          PYEOF
          gh pr comment "$PR_NUMBER" --body-file /tmp/coverage-comment.md

