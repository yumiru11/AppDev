# 截图基线「云端录制」（#170 / D02 的配套工具）。
#
# ## 为什么需要它
#
# Robolectric 的 Native Graphics 渲染结果**依赖运行环境**（字体、原生库版本、JDK），
# 同一份代码在本机与 GitHub runner 上渲染出的 PNG **不是逐字节相同**的。
# PR #181 实测：本机录的 core:ui 基线在 CI 上 verify 全红（8 张），而 :app 的基线
# 之所以一直绿，是因为它当初就是「云端补录」的。
#
# 结论：**模块级截图基线必须以 CI 为唯一权威录制环境**。本 workflow 就是那个录制器。
#
# ## 用法
#   1. Actions → "Record screenshots (CI canonical)" → Run workflow（选目标分支）
#   2. 跑完下载 artifact（recorded-screenshots）
#   3. 解压覆盖各模块 src/test/screenshots/*.png，提交
#
# 产物只用于提交基线，workflow 本身**不会**改动仓库。
name: Record screenshots (CI canonical)

on:
  workflow_dispatch:

concurrency:
  group: record-screenshots
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  record:
    name: Record all module baselines
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Override local JDK path for CI
        run: python3 -c "import re; p='gradle.properties'; s=open(p).read(); open(p,'w').write(re.sub(r'(?m)^org\\.gradle\\.java\\.home.*\\n?', '', s))"

      - name: Seed plugin artifacts into mavenLocal
        run: bash .github/gradle/seed-plugins.sh

      - uses: gradle/actions/setup-gradle@v6

      # 覆盖全部有 src/test/screenshots 的模块。
      # 2026-09-12 更正（旧注释误以为「record 不做 idle 等待所以安全」）：record 与 verify 走同一
      # 条 compose 捕获路径，同样调用 ShadowLooper.shadowMainLooper().idle() —— :feature:issue
      # 曾经的无限动画挂起在 record 下一样存在（CI 实测：该模块 test 任务 11:13:15→11:29:51
      # 共 16.5 分钟，其余模块同任务均 < 1 分钟；本机 record 直接挂死）。该问题已由
      # core:testing 的 captureScreenshotDeterministic（冻结时钟 + 手工 draw + Bitmap 捕获）
      # 从测试侧修复。
      - name: Record all screenshots
        run: |
          ./gradlew \
            :app:recordRoborazziDebug \
            :core:ui:recordRoborazziDebug \
            :core:designsystem:recordRoborazziDebug \
            :core:markdown:recordRoborazziDebug \
            :feature:auth:recordRoborazziDebug \
            :feature:repo:recordRoborazziDebug \
            :feature:issue:recordRoborazziDebug \
            :feature:notifications:recordRoborazziDebug \
            :feature:pullrequest:recordRoborazziDebug \
            :feature:home:recordRoborazziDebug \
            :feature:search:recordRoborazziDebug \
            :feature:editor:recordRoborazziDebug \
            :feature:profile:recordRoborazziDebug \
            :feature:settings:recordRoborazziDebug \
            --no-daemon

      - name: Collect recorded baselines
        run: |
          mkdir -p artifacts/baselines
          # 保留模块相对路径，解压后可直接覆盖仓库
          find . -path "*/src/test/screenshots/*.png" -not -path "./artifacts/*" -print0 \
            | xargs -0 -I{} sh -c 'mkdir -p "artifacts/baselines/$(dirname "{}")" && cp "{}" "artifacts/baselines/{}"'
          echo "录制到 $(find artifacts/baselines -name "*.png" | wc -l) 张基线"
          find artifacts/baselines -name "*.png" | sort | head -50

      - name: Upload recorded baselines
        uses: actions/upload-artifact@v7
        with:
          name: recorded-screenshots
          path: artifacts/baselines/**
          if-no-files-found: error
