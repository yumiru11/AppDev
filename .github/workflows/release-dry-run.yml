# 发布链路演练（T25 / #26）。
#
# 为什么单独开一个 workflow：
#   release.yml 需要仓库 Secrets 里的**生产签名密钥**（KEYSTORE_BASE64 等），
#   而生产密钥是本项目唯一不可逆的身份资产，只能由项目所有者生成并保管。
#   在密钥就位之前，「签名发布是否真的能跑通」这件事不能靠"读代码觉得没问题"——
#   这条 workflow 用**作业内生成的临时 keystore** 走完全相同的 Gradle 签名路径，
#   把除密钥本身之外的每一环都验证掉：
#     ① 临时 keystore 生成（keytool）
#     ② 签名 Release APK + AAB（app/build.gradle.kts 的 signingConfigs 逻辑）
#     ③ apksigner 验签（确认产物真的带上签名，而不是静默出未签名包）
#     ④ **baseline profile 打包校验**（assets/dexopt/baseline.prof 必须存在）
#     ⑤ mapping.txt 归档（release 崩溃栈反混淆的前提）
#
# ⚠️ 本 workflow 产出的 APK/AAB **不是可发布产物**（签名身份是临时的），
#    只作流水线验证；正式发布仍走 release.yml（tag v* + 生产 Secrets）。
name: Release dry run

on:
  workflow_dispatch:

concurrency:
  group: release-dry-run
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dry-run:
    name: Signed release pipeline (ephemeral keystore)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Override local JDK path for CI
        run: python3 -c "import re; p='gradle.properties'; s=open(p).read(); open(p,'w').write(re.sub(r'(?m)^org\\.gradle\\.java\\.home.*\\n?', '', s))"

      - name: Seed plugin artifacts into mavenLocal
        run: bash .github/gradle/seed-plugins.sh

      - uses: gradle/actions/setup-gradle@v6

      # 临时签名身份：只活在本次 run 里，用完即弃（与生产密钥无关）。
      # 生成后导出成 Gradle 读得懂的环境变量（app/build.gradle.kts 已支持 KEYSTORE_FILE 等）。
      - name: Generate ephemeral keystore
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/keystore/dry-run.keystore" \
            -alias dryrun -keyalg RSA -keysize 2048 -validity 30 \
            -storepass dryrunpass -keypass dryrunpass \
            -dname "CN=AppDev Dry Run, OU=CI, O=AppDev, L=NA, ST=NA, C=CN"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/keystore/dry-run.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=dryrunpass" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=dryrun" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=dryrunpass" >> "$GITHUB_ENV"

      - name: Build signed release APK + AAB
        run: ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Verify signature and baseline profile packaging
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          AAB=$(find app/build/outputs/bundle/release -name '*.aab' | head -1)
          test -n "$APK" || { echo "::error::release APK 未产出"; exit 1; }
          test -n "$AAB" || { echo "::error::release AAB 未产出"; exit 1; }

          echo "### Release dry run" >> "$GITHUB_STEP_SUMMARY"
          ls -lh "$APK" "$AAB" | awk '{print "- " $5 " " $9}' >> "$GITHUB_STEP_SUMMARY"

          # ① 签名必须真的在（防止 keystore 没生效时静默产出未签名包）
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | head -5

          # ② baseline profile 必须打进 APK（T25 验收项，静默丢失会导致启动优化完全失效）
          if ! unzip -l "$APK" | grep -q "assets/dexopt/baseline.prof"; then
            echo "::error::APK 内缺少 assets/dexopt/baseline.prof —— baseline profile 未被打包"
            exit 1
          fi
          echo "baseline.prof 已打包 ✓" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dry-run artifacts (NOT for distribution)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-dry-run-unsigned-for-distribution
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
