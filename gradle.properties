org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# JDK 21 要求：AGP 9.x 最低 JDK 17（本仓锁 21，兼容）。仓库不写死本机路径——
# 本机在 ~/.gradle/gradle.properties 指定 org.gradle.java.home（不入库），CI 用 setup-java@v4 temurin 21
android.useAndroidX=true
# AGP 9 起 android.sdk.defaultTargetSdkToCompileSdkIfUnset 默认翻为 true：未显式设置 targetSdk 的
# **库模块**会取 compileSdk=37 → 写进 Robolectric 单元测试清单，Robolectric 4.16.1 报
# "Package targetSdkVersion=37 > maxSdkVersion=36"（:core:designsystem AppDevOcticonsTest 首个暴露）。
# 库模块的 new-DSL DefaultConfig 没有 targetSdk 可写（Unresolved reference 实测），故关回旧默认
# （未设置 = 不写 targetSdk），保持 AGP 8 时代语义；:app 仍显式 targetSdk = 35（不受影响）。
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
kotlin.code.style=official
android.nonTransitiveRClass=true

# 注（AGP 9 迁移）：迁移期曾需要 android.uniquePackageNames=false —— com.composables 的
# base `-android` artifact 与 `-cmp` artifact 发布了同一 namespace（com.composables.icons.
# materialsymbols.rounded）。实测 base `-android` 是空壳（classes.jar 0 条目，只有从未被引用的
# drawable XML），已从 core:editor / feature:{repo,editor,pullrequest} 移除并删掉 6 个 base alias
# → 撞车源消失，不再需要该逃生开关。若未来重新引入 com.composables 的 `-android` artifact，
# 必须重新评估（AGP 10 将移除该开关）。

# Parallel build
org.gradle.parallel=true
org.gradle.caching=true