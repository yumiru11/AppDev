org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -Dhttp.proxyHost=127.0.0.1 -Dhttp.proxyPort=18080 -Dhttps.proxyHost=127.0.0.1 -Dhttps.proxyPort=18080 -Dhttp.nonProxyHosts=localhost|127.0.0.1
# 固定 JDK 21：AGP 8.7.3 最高支持 JDK 21，本机默认 zulu-25 会导致构建失败（报 "25.0.3"）
org.gradle.java.home=/root/.local/share/mise/installs/java/21.0.2
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# AGP 8.7.3 最高测试至 compileSdk 35，我们使用 36（OkHttp 5.4 要求），属已知兼容
android.suppressUnsupportedCompileSdk=36

# Parallel build
org.gradle.parallel=true
org.gradle.caching=true

# 测试 JVM 代理（Robolectric 运行时下载 android-all jar 需走代理；不入库，本地环境）
