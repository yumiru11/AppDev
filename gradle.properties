org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# JDK 21 要求：AGP 8.7.3 最高支持 JDK 21（25 会导致构建失败）。仓库不写死本机路径——
# 本机在 ~/.gradle/gradle.properties 指定 org.gradle.java.home（不入库），CI 用 setup-java@v4 temurin 21
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# AGP 9.0 把 android.uniquePackageNames 的默认值从 false 翻成 true（要求每个 library 有独立 namespace）。
# 本项目同时依赖 com.composables 的两个 artifact：
#   icons-material-symbols-rounded-android      （base，提供 MaterialSymbols 命名空间）
#   icons-material-symbols-rounded-cmp-android  （cmp 变体，ImageVector 对象）
# 二者**第三方 namespace 撞车**（都是 com.composables.icons.materialsymbols.rounded），
# 非本项目可控 → :app:processDebugMainManifest 直接失败：
#   Namespace 'com.composables.icons.materialsymbols.rounded' is used in multiple modules
#   and/or libraries: ...-rounded-android:2.2.1, ...-rounded-cmp-android-debug:2.2.1
# 官方给的迁移期退出口就是关掉该检查（"If that is not possible, you can disable this flag
# while you migrate"）。真正解法是去掉其中一个 artifact 或等上游修 namespace —— 见
# docs/agents/agp9-feasibility-2026-09-11.md §6。
android.uniquePackageNames=false

# Parallel build
org.gradle.parallel=true
org.gradle.caching=true