[versions]
agp = "9.1.1"
kotlin = "2.3.21"
# KSP2 纯版本号；2.3.8 起调用 AGP 9 才有的 addKspConfigurations(boolean)，
# AGP 9 迁移完成后解锁到 2.3.12（AGP 官方 skill 要求 AGP 9 下 KSP ≥ 2.3.6）。
ksp = "2.3.12"
compose-bom = "2026.06.01"
# ⚠️ M3 Expressive 临时 pin（技术债，决策与撤除条件见 docs/adr/0008-material3-alpha18-pin.md）
# 为什么 pin alpha：Expressive 的组件（LoadingIndicator / Circular·LinearWavyProgressIndicator /
#   SplitButtonLayout / ButtonGroup / Medium·LargeFlexibleTopAppBar）与公开的
#   MotionScheme.standard()/expressive() 工厂全部只存在于 material3 1.5.0 线；
#   1.4.0（BOM 当前 pin）里 MotionScheme 工厂在 Kotlin 层是 internal，拿不到。
# 为什么是 alpha18 而不是更高：1.5.0-alpha19 起 AAR 元数据升到 minCompileSdk=37 + minAGP=9.1.0。
#   本仓已升到 compileSdk 37 / AGP 9.1.1（chore/agp9-migration），工具链门控已解除——
#   alpha19+/stable 现已可达，但升 alpha 本身是独立决策（ADR-0008 的撤除条件），不在本次迁移范围。
# 为什么不改 compose-bom：BOM 覆盖 Compose 全家（ui/foundation/runtime/…），
#   改 BOM 会把整条 Compose 线一起拖到 alpha，改动面与风险远大于只 pin 单个 artifact。
#   显式版本的直接依赖在冲突解析里胜过 BOM 的 constraint（alpha18 > 1.4.0），故只动这一个 key。
# 何时撤掉：material3 1.5.0 stable 发布且回归某个 compose-bom 后，删除本 version 与
#   compose-material3 的 version.ref（回到纯 BOM 托管）；若届时已升 AGP 9 + compileSdk 37，
#   也可直接跟到当时的 stable/BOM。撤除前必须重跑全门禁 + 重录截图基线。
compose-material3 = "1.5.0-alpha18"
# Hilt：AGP 9 移除旧 variant API（applicationVariants 等）→ 2.57.2 插件直接报
# "Android BaseExtension not found."，必须 ≥ 2.59.2（AGP 官方 skill 要求）。
hilt = "2.59.2"
apollo = "5.0.1"
retrofit = "3.0.0"
okhttp = "5.4.0"
okio = "3.18.1"
coil = "3.4.0"
# Haze（chrisbanes/haze）：毛玻璃 backdrop blur（issue #83，ui-audit 缺陷 #1 修复载体）
# 1.7.2 传递 androidx.activity 1.12.2 需 AGP≥8.9.1，与锁定基线 AGP 8.7.3 冲突 → 取 1.6.10
haze = "1.6.10"
jacoco = "0.8.13"
lifecycle = "2.8.7"
activity-compose = "1.9.3"
datastore = "1.1.3"
navigation-compose = "2.8.4"
androidx-browser = "1.8.0"
androidx-webkit = "1.12.1"
core-ktx = "1.13.1"
# 品牌化启动屏（D3 修复）：消除冷启动"白屏空窗"，并把应用图标带进启动画面
core-splashscreen = "1.0.1"
# ProfileInstaller（T25）：API 24-30 上把打包进 APK 的 baseline profile 安装到 ART
# （API 31+ 由编译期 baseline.profm 直接生效，无需运行时安装）
profileinstaller = "1.4.1"
security-crypto = "1.1.0-alpha06"
kotlinx-serialization = "1.7.3"
kotlinx-coroutines = "1.9.0"
markdown = "0.38.1"
# KotlinTextMate（VS Code 同款语法高亮，替换 deprecated 的 markdown-code 高亮；坐标来自 prototype 分支实测）
textmate = "0.2.0"
icons = "2.2.1"
sora = "0.23.6"
appauth = "0.11.1"
room = "2.8.4"
paging = "3.5.0"
# Apollo Kotlin 5 的新版 Normalized Cache（独立仓库 apollo-kotlin-normalized-cache）
apollo-normalized-cache = "1.0.6"
hilt-navigation-compose = "1.2.0"

# Quality（T1 质量门禁）
spotless = "8.9.0"
detekt = "1.23.8"
ktlint = "1.8.0"
konsist = "0.17.3"

# 调试工具链（#169 / L14）：Timber 日志、Chucker 网络面板、LeakCanary 内存泄漏
timber = "5.0.1"
chucker = "4.0.0"
leakcanary = "2.14"

# Testing
robolectric = "4.16.1"
roborazzi = "1.71.0"
junit = "4.13.2"
mockk = "1.14.11"
turbine = "1.2.1"
mockwebserver = "5.4.0"

[libraries]
# Compose BOM
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "compose-material3" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }

# Haze（chrisbanes/haze）：backdrop blur——hazeSource 标内容侧 / hazeEffect 标玻璃栏侧（issue #83）
haze = { group = "dev.chrisbanes.haze", name = "haze", version.ref = "haze" }

# Icons — Material Symbols（= marella.github.io / fonts.google.com 同一套 Google 图标），MIT
# 只用 `-cmp` 变体：ImageVector 对象（Compose 直接引用，如 MaterialSymbols.Rounded.Info）+
# base-cmp 提供 MaterialSymbols 命名空间；老 base `-android` artifact 实测为空壳
# （classes.jar 0 条目，只有未被引用的 drawable XML）且与 `-cmp` 共用 namespace
# → 全部移除（AGP 9 的 uniquePackageNames=true 下会撞车，详见 gradle.properties 注释）。
# cmp 变体：ImageVector 对象（Compose 直接引用，如 MaterialSymbols.Rounded.Info）；base 提供 MaterialSymbols 命名空间
icons-material-symbols-base-cmp = { group = "com.composables", name = "icons-material-symbols-cmp", version.ref = "icons" }
icons-material-symbols-rounded-cmp = { group = "com.composables", name = "icons-material-symbols-rounded-cmp", version.ref = "icons" }

# Activity + Lifecycle
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# Navigation
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation-compose" }
androidx-browser = { group = "androidx.browser", name = "browser", version.ref = "androidx-browser" }
# WebViewAssetLoader（assets 安全加载，禁 file://；T8 WebView 兜底通道用）
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "androidx-webkit" }

# Core
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "core-splashscreen" }
profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }

# Paging
paging-compose = { group = "androidx.paging", name = "paging-compose", version.ref = "paging" }
paging-runtime = { group = "androidx.paging", name = "paging-runtime", version.ref = "paging" }
paging-testing = { group = "androidx.paging", name = "paging-testing", version.ref = "paging" }

# Room
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }

# Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-android-testing = { group = "com.google.dagger", name = "hilt-android-testing", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hilt-navigation-compose" }

# Apollo Kotlin
apollo-runtime = { group = "com.apollographql.apollo", name = "apollo-runtime", version.ref = "apollo" }
# Apollo 5 旧版 apollo-normalized-cache 已弃用且 builder 装配均为 internal，
# 改用新版独立缓存库（需配套 apollo compiler plugin，见 core:github-graphql）
apollo-normalized-cache = { group = "com.apollographql.cache", name = "normalized-cache", version.ref = "apollo-normalized-cache" }
apollo-normalized-cache-sqlite = { group = "com.apollographql.cache", name = "normalized-cache-sqlite", version.ref = "apollo-normalized-cache" }

# Retrofit + OkHttp
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
okio = { group = "com.squareup.okio", name = "okio", version.ref = "okio" }

# Serialization
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
# #90 类型安全路由：core:navigation 的 @Serializable AppRoute 只需 core（navigation 运行期自带依赖）
kotlinx-serialization-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-core", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }

# DataStore
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Coil 3（coil-core 默认不带网络，必须另加 coil-network-*）
coil = { group = "io.coil-kt.coil3", name = "coil", version.ref = "coil" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-gif = { group = "io.coil-kt.coil3", name = "coil-gif", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
coil-svg = { group = "io.coil-kt.coil3", name = "coil-svg", version.ref = "coil" }

# Markdown（mikepenz multiplatform-markdown-renderer，与 M3 主题模块 + coil3 桥 + 高亮模块同版本）
markdown-renderer = { group = "com.mikepenz", name = "multiplatform-markdown-renderer", version.ref = "markdown" }
markdown-renderer-m3 = { group = "com.mikepenz", name = "multiplatform-markdown-renderer-m3", version.ref = "markdown" }
markdown-renderer-code = { group = "com.mikepenz", name = "multiplatform-markdown-renderer-code", version.ref = "markdown" }
markdown-renderer-coil3 = { group = "com.mikepenz", name = "multiplatform-markdown-renderer-coil3", version.ref = "markdown" }

# KotlinTextMate（compose 封装，io.github.ivan-magda；坐标来自 prototype 分支实测）
# ⚠️ key 不能以 kotlin- 开头：会与 [versions] 的 kotlin 生成访问器冲突，导致 libs.versions.kotlin 不可用（Gradle 8.12 实测）
textmate-compose = { group = "io.github.ivan-magda", name = "kotlin-textmate-compose", version.ref = "textmate" }

# Auth（OAuth PKCE）
appauth = { group = "net.openid", name = "appauth", version.ref = "appauth" }

# Security
security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "security-crypto" }

# Code editor（Rosemoe Sora Editor）
sora-editor-bom = { group = "io.github.Rosemoe.sora-editor", name = "bom", version.ref = "sora" }
sora-editor = { group = "io.github.Rosemoe.sora-editor", name = "editor", version.ref = "sora" }
sora-language-textmate = { group = "io.github.Rosemoe.sora-editor", name = "language-textmate", version.ref = "sora" }

# 调试工具链（#169 / L14）
timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }
# Chucker：debug 变体带 UI 面板，release 变体走 library-no-op（同 API 空实现，编译期同一份代码）
chucker-library = { group = "com.github.chuckerteam.chucker", name = "library", version.ref = "chucker" }
chucker-library-noop = { group = "com.github.chuckerteam.chucker", name = "library-no-op", version.ref = "chucker" }
leakcanary-android = { group = "com.squareup.leakcanary", name = "leakcanary-android", version.ref = "leakcanary" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
mockwebserver3 = { group = "com.squareup.okhttp3", name = "mockwebserver3", version.ref = "mockwebserver" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
konsist = { group = "com.lemonappdev", name = "konsist", version.ref = "konsist" }
roborazzi = { group = "io.github.takahirom.roborazzi", name = "roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose", version.ref = "roborazzi" }
roborazzi-junit-rule = { group = "io.github.takahirom.roborazzi", name = "roborazzi-junit-rule", version.ref = "roborazzi" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# Compose 编译器插件（built-in Kotlin 仍需显式应用；kotlin-android 已由 AGP 9 built-in Kotlin 接管，
# 对应的 android-library/android-application plugin alias 也不再声明 kotlin-android）
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
apollo = { id = "com.apollographql.apollo", version.ref = "apollo" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }